name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./manifest.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "tag $GITHUB_REF_NAME != manifest version $VER" >&2
            exit 1
          fi

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build packages
        run: npm run build

      - name: Lint Firefox package
        run: npm run lint:firefox

      - name: Collect artifacts
        run: |
          ls -l dist/*.zip
          du -sh dist/*.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MoodleTweaks-*.zip
          generate_release_notes: true
          draft: true